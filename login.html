<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Github Profile</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Search Github Profile</h1>
    <div class="search">
      <input type="text" placeholder="Enter Your Github Username" id="searchInput" name="searchInput"/>
      <button id="searchButton">Search</button>
    </div>
    <div class="profile-box">
      <div class="left">
        <div class="avatar">
          <img src="" alt="User Avatar" id="avatar" />
        </div>
        <div class="self">
          <h1>Rishi</h1>
          <h1>@rishi</h1>
          <p>Web Developer</p>
        </div>
      </div>
      <button class="profile-btn">Check Profile</button>
    </div>
  </div>
</body>
<script src="Script.js"></script>
</html>
