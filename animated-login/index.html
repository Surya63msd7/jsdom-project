<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexusAuth &bull; Interactive Animated Login</title>
  <!-- Google Fonts: Plus Jakarta Sans for ultra-clean modern typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ambient Animated Background Gradients & Particles -->
  <div class="ambient-background" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <canvas id="particleCanvas"></canvas>
  </div>

  <main class="login-wrapper">
    <div class="card-container" id="cardContainer">
      <!-- 3D Tilting Glass Card -->
      <div class="glass-card" id="glassCard">
        
        <!-- Interactive Animated Mascot Avatar -->
        <div class="mascot-wrapper" id="mascotWrapper" title="I react to your typing!">
          <div class="mascot-glow"></div>
          <svg id="mascotSvg" viewBox="0 0 200 160" width="150" height="120" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <radialGradient id="headGrad" cx="50%" cy="40%" r="60%">
                <stop offset="0%" stop-color="#3b4262"/>
                <stop offset="100%" stop-color="#181c2e"/>
              </radialGradient>
              <linearGradient id="pawGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#4f5982"/>
                <stop offset="100%" stop-color="#1d2238"/>
              </linearGradient>
              <linearGradient id="earInnerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#f472b6"/>
                <stop offset="100%" stop-color="#ec4899"/>
              </linearGradient>
              <filter id="cheekGlow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="3" result="blur" />
              </filter>
            </defs>

            <!-- Ears -->
            <g class="ears">
              <circle cx="56" cy="46" r="22" fill="#232840" />
              <circle cx="56" cy="46" r="13" fill="url(#earInnerGrad)" opacity="0.8" />
              <circle cx="144" cy="46" r="22" fill="#232840" />
              <circle cx="144" cy="46" r="13" fill="url(#earInnerGrad)" opacity="0.8" />
            </g>

            <!-- Mascot Head -->
            <rect id="mascotHead" x="42" y="38" width="116" height="102" rx="46" ry="46" fill="url(#headGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />

            <!-- Cheeks -->
            <ellipse cx="62" cy="106" rx="8" ry="5" fill="#f472b6" opacity="0.5" filter="url(#cheekGlow)" />
            <ellipse cx="138" cy="106" rx="8" ry="5" fill="#f472b6" opacity="0.5" filter="url(#cheekGlow)" />

            <!-- Eyes Group -->
            <g id="eyesGroup">
              <!-- Left Eye White -->
              <ellipse cx="76" cy="86" rx="14" ry="16" fill="#ffffff" />
              <!-- Right Eye White -->
              <ellipse cx="124" cy="86" rx="14" ry="16" fill="#ffffff" />

              <!-- Left Pupil -->
              <g id="leftPupilGroup" class="pupil-group">
                <circle id="leftPupil" cx="76" cy="86" r="7.5" fill="#0f172a" />
                <circle cx="73.5" cy="83" r="2.5" fill="#ffffff" />
                <circle cx="78" cy="88" r="1.2" fill="#60a5fa" />
              </g>

              <!-- Right Pupil -->
              <g id="rightPupilGroup" class="pupil-group">
                <circle id="rightPupil" cx="124" cy="86" r="7.5" fill="#0f172a" />
                <circle cx="121.5" cy="83" r="2.5" fill="#ffffff" />
                <circle cx="126" cy="88" r="1.2" fill="#60a5fa" />
              </g>

              <!-- Eyelids for blinking -->
              <path id="leftEyelid" class="eyelid" d="M 62,86 Q 76,86 90,86" stroke="#181c2e" stroke-width="0" fill="#252a42" />
              <path id="rightEyelid" class="eyelid" d="M 110,86 Q 124,86 138,86" stroke="#181c2e" stroke-width="0" fill="#252a42" />
            </g>

            <!-- Snout & Mouth -->
            <g id="snoutGroup">
              <ellipse cx="100" cy="103" rx="16" ry="11" fill="#282f4d" />
              <path d="M 95 98 C 97 96, 103 96, 105 98 C 105 102, 95 102, 95 98 Z" fill="#f472b6" />
              <path id="mascotMouth" class="mouth" d="M 96 104 Q 100 108 104 104" stroke="#e2e8f0" stroke-width="2" stroke-linecap="round" fill="none" />
            </g>

            <!-- Paws for Peekaboo -->
            <g id="paws">
              <!-- Left Paw -->
              <g id="leftPaw" class="paw paw-left">
                <path d="M 38 160 C 38 128, 68 126, 76 136 C 82 144, 78 160, 78 160 Z" fill="url(#pawGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
                <circle cx="56" cy="138" r="4" fill="#f472b6" opacity="0.6" />
                <circle cx="48" cy="144" r="2.8" fill="#f472b6" opacity="0.6" />
                <circle cx="64" cy="144" r="2.8" fill="#f472b6" opacity="0.6" />
              </g>

              <!-- Right Paw -->
              <g id="rightPaw" class="paw paw-right">
                <path d="M 162 160 C 162 128, 132 126, 124 136 C 118 144, 122 160, 122 160 Z" fill="url(#pawGrad)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />
                <circle cx="144" cy="138" r="4" fill="#f472b6" opacity="0.6" />
                <circle cx="136" cy="144" r="2.8" fill="#f472b6" opacity="0.6" />
                <circle cx="152" cy="144" r="2.8" fill="#f472b6" opacity="0.6" />
              </g>
            </g>
          </svg>
        </div>

        <!-- Header -->
        <header class="card-header">
          <h1 class="brand-title">Welcome to Nexus</h1>
          <p class="brand-subtitle" id="formSubtitle">Enter your credentials to access your console</p>
        </header>

        <!-- Segmented Tab Navigation -->
        <nav class="tabs-nav" aria-label="Authentication modes">
          <div class="tabs-indicator" id="tabsIndicator"></div>
          <button type="button" class="tab-btn active" id="signInTab" aria-selected="true" role="tab">Sign In</button>
          <button type="button" class="tab-btn" id="signUpTab" aria-selected="false" role="tab">Create Account</button>
        </nav>

        <!-- Forms Container with slide animations -->
        <div class="forms-slider" id="formsSlider">
          
          <!-- SIGN IN FORM -->
          <form class="auth-form" id="signInForm" novalidate>
            <!-- Email / Username Input Group -->
            <div class="form-group">
              <div class="input-container">
                <input 
                  type="email" 
                  id="signInEmail" 
                  class="form-input" 
                  placeholder=" "
                  required 
                  autocomplete="email"
                >
                <label for="signInEmail" class="floating-label">Email Address</label>
                <span class="input-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                  </svg>
                </span>
              </div>
              <span class="error-msg" id="signInEmailError" aria-live="polite"></span>
            </div>

            <!-- Password Input Group -->
            <div class="form-group">
              <div class="input-container">
                <input 
                  type="password" 
                  id="signInPassword" 
                  class="form-input password-input" 
                  placeholder=" "
                  required 
                  autocomplete="current-password"
                >
                <label for="signInPassword" class="floating-label">Password</label>
                <button type="button" class="toggle-password-btn" aria-label="Toggle password visibility" tabindex="0">
                  <svg class="eye-open-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg class="eye-closed-icon hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-.722-3.25"/><path d="M2 8a10.645 10.645 0 0 0 20 0"/><path d="m20 15-1.726-2.05"/><path d="m4 15 1.726-2.05"/><path d="m9 18 .722-3.25"/>
                  </svg>
                </button>
              </div>
              <span class="error-msg" id="signInPasswordError" aria-live="polite"></span>
            </div>

            <!-- Options Row -->
            <div class="form-options">
              <label class="custom-checkbox">
                <input type="checkbox" id="rememberMe">
                <span class="checkmark">
                  <svg width="12" height="10" viewBox="0 0 12 10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="1.5 5 4.5 8 10.5 2"/>
                  </svg>
                </span>
                <span class="checkbox-label">Remember me</span>
              </label>
              <a href="#forgot" class="forgot-link" id="forgotPasswordLink">Forgot password?</a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn" id="signInSubmitBtn">
              <span class="btn-ripple"></span>
              <span class="btn-text">Sign In</span>
              <span class="btn-loader"></span>
            </button>
          </form>

          <!-- SIGN UP FORM -->
          <form class="auth-form" id="signUpForm" novalidate>
            <!-- Full Name -->
            <div class="form-group">
              <div class="input-container">
                <input 
                  type="text" 
                  id="signUpName" 
                  class="form-input" 
                  placeholder=" "
                  required 
                  autocomplete="name"
                >
                <label for="signUpName" class="floating-label">Full Name</label>
                <span class="input-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
                  </svg>
                </span>
              </div>
              <span class="error-msg" id="signUpNameError" aria-live="polite"></span>
            </div>

            <!-- Email -->
            <div class="form-group">
              <div class="input-container">
                <input 
                  type="email" 
                  id="signUpEmail" 
                  class="form-input" 
                  placeholder=" "
                  required 
                  autocomplete="email"
                >
                <label for="signUpEmail" class="floating-label">Email Address</label>
                <span class="input-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                  </svg>
                </span>
              </div>
              <span class="error-msg" id="signUpEmailError" aria-live="polite"></span>
            </div>

            <!-- Password -->
            <div class="form-group">
              <div class="input-container">
                <input 
                  type="password" 
                  id="signUpPassword" 
                  class="form-input password-input" 
                  placeholder=" "
                  required 
                  autocomplete="new-password"
                >
                <label for="signUpPassword" class="floating-label">Create Password</label>
                <button type="button" class="toggle-password-btn" aria-label="Toggle password visibility" tabindex="0">
                  <svg class="eye-open-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 .696 10.75 10.75 0 0 1-19.876 0"/>
                    <circle cx="12" cy="12" r="3"/>
                  </svg>
                  <svg class="eye-closed-icon hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="m15 18-.722-3.25"/><path d="M2 8a10.645 10.645 0 0 0 20 0"/><path d="m20 15-1.726-2.05"/><path d="m4 15 1.726-2.05"/><path d="m9 18 .722-3.25"/>
                  </svg>
                </button>
              </div>
              
              <!-- Password Strength Bar -->
              <div class="strength-meter" id="strengthMeter">
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <span class="strength-text" id="strengthText">Enter at least 6 characters</span>
              </div>
              <span class="error-msg" id="signUpPasswordError" aria-live="polite"></span>
            </div>

            <!-- Terms -->
            <div class="form-options">
              <label class="custom-checkbox">
                <input type="checkbox" id="agreeTerms" required>
                <span class="checkmark">
                  <svg width="12" height="10" viewBox="0 0 12 10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="1.5 5 4.5 8 10.5 2"/>
                  </svg>
                </span>
                <span class="checkbox-label">I agree to the <a href="#terms" class="inline-link">Terms & Privacy</a></span>
              </label>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn" id="signUpSubmitBtn">
              <span class="btn-ripple"></span>
              <span class="btn-text">Create Account</span>
              <span class="btn-loader"></span>
            </button>
          </form>

        </div>

        <!-- Social Logins Section -->
        <div class="divider">
          <span>or continue with</span>
        </div>

        <div class="social-row">
          <button type="button" class="social-btn" aria-label="Sign in with Google" title="Google">
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.7l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/>
              <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
              <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15s.7 5.3 1.9 7.7l3.7-2.9z"/>
              <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.4-6.4-5.2L1.9 16C3.7 19.7 7.5 23 12 23z"/>
            </svg>
          </button>
          
          <button type="button" class="social-btn" aria-label="Sign in with GitHub" title="GitHub">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
            </svg>
          </button>

          <button type="button" class="social-btn" aria-label="Sign in with Apple" title="Apple">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.38c.62-.75 1.04-1.8 1.01-2.85-.94.04-2.09.63-2.76 1.41-.59.68-1.11 1.76-1 2.81 1.05.08 2.13-.59 2.75-1.37z"/>
            </svg>
          </button>
        </div>

      </div>
    </div>
  </main>

  <!-- Interactive Toast Notification Component -->
  <div class="toast-container" id="toastContainer" aria-live="assertive"></div>

  <script src="script.js"></script>
</body>
</html>
